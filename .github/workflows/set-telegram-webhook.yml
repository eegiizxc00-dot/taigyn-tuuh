
name: Set Telegram Webhook

on:
  workflow_dispatch:

jobs:
  set-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Register Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WEBHOOK_URL: https://taigyn-tuuh.pages.dev/api/telegram/webhook
        run: |
          BODY=$(jq -n \
            --arg url "$WEBHOOK_URL" \
            --arg secret "$WEBHOOK_SECRET" \
            '{url: $url, secret_token: $secret, drop_pending_updates: true}')

          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "$BODY"

      - name: Check Telegram Webhook
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail-with-body -sS \
            "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo" \
            | jq '{ok, url: .result.url, pending_update_count: .result.pending_update_count, last_error_message: .result.last_error_message}'
